<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mood garden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@400;500&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<script>
  /* Keeps the page see-through inside Notion. If your Notion is in dark mode, add ?dark to the embed link */
  if (/[?&]dark\b/.test(location.search)) document.documentElement.style.colorScheme = "dark";
</script>
<style>
  .card { width:100%; max-width:336px; padding:20px 14px 16px; display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center; }
  .bouquet { position:relative; width:100%; max-width:208px; aspect-ratio:1; }
  .bouquet svg { width:100%; height:100%; display:block; overflow:visible; }
  .hint { position:absolute; left:0; right:0; top:22%; font-size:15px; color:var(--moss); padding:0 18px; }
  .hint[hidden] { display:none; }
  .pop { animation:pop .6s cubic-bezier(.3,1.5,.5,1); transform-origin:50% 50%; transform-box:fill-box; }
  @keyframes pop { from { transform:scale(.2) } to { transform:scale(1) } }

  .week { display:flex; gap:4px; justify-content:center; }
  .day { width:34px; display:flex; flex-direction:column; align-items:center; gap:4px; font-size:13px; color:var(--moss); }
  .slot { width:30px; height:30px; border-radius:50%; display:grid; place-items:center; background:var(--mistc); border:1.5px dashed var(--slate); }
  .slot.filled { border:1.5px solid var(--slate); background:var(--mistc); }
  .day.today { color:var(--night); font-weight:700; }
  .day.today .slot { border:2px solid var(--deep); background:var(--seaglass); }

  .ask { font-family:var(--title); font-size:16px; font-weight:400; margin-top:4px; }
  .moods { display:grid; grid-template-columns:repeat(3, 1fr); gap:10px 8px; width:100%; padding:0 4px; }
  .mood { display:flex; flex-direction:column; align-items:center; gap:3px; padding:8px 2px 7px; font-size:13px; border-radius:18px; }
  .foot { font-size:13px; color:var(--moss); }
  @media (prefers-reduced-motion: reduce) { .pop { animation:none; } }
</style>
</head>
<body>
<main class="card px-card">
  <h1 class="px-title">Mood garden</h1>
  <p class="px-sub" id="sub">This week's bouquet</p>

  <div class="bouquet">
    <svg id="jar" viewBox="0 0 200 200" role="img" aria-label="This week's bouquet"></svg>
    <p class="hint" id="hint">Pick a flower to start your bouquet ♡</p>
  </div>

  <div class="week" id="week"></div>

  <p class="ask" id="ask">How are you feeling today?</p>
  <div class="moods" id="moods"></div>
  <button class="px-btn primary" id="save">Download bouquet ♡</button>
  <p class="foot">A new bouquet starts every Monday</p>
</main>

<script>
  /* ---------- Palette: #041421 #042630 #4c7273 #86b9b0 #d0d6d6 ---------- */
  const C = { night:"#041421", deep:"#042630", slate:"#4c7273", sea:"#86b9b0", mist:"#d0d6d6", paper:"#d0d6d6", line:"#4c7273" };
  // Each mood is a different flower drawn only in the five palette colours
  const MOODS = [
    { id:"joyful",   label:"Joyful",   petal:"#86b9b0", center:"#041421", petals:10, shape:"long"  },
    { id:"calm",     label:"Calm",     petal:"#d0d6d6", center:"#86b9b0", petals:6,  shape:"round" },
    { id:"loved",    label:"Loved",    petal:"#86b9b0", center:"#d0d6d6", petals:5,  shape:"heart" },
    { id:"tired",    label:"Tired",    petal:"#d0d6d6", center:"#4c7273", petals:7,  shape:"round" },
    { id:"down",     label:"Down",     petal:"#4c7273", center:"#d0d6d6", petals:5,  shape:"round" },
    { id:"stressed", label:"Stressed", petal:"#042630", center:"#86b9b0", petals:9,  shape:"long"  },
  ];
  const DAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
  // tip of each weekday's stem, fanning out of the vase as the week fills
  const SPOTS = [ {x:100,y:44,r:17}, {x:64,y:60,r:15}, {x:136,y:58,r:15}, {x:80,y:26,r:13}, {x:120,y:24,r:13}, {x:42,y:88,r:13}, {x:158,y:86,r:13} ];
  const $ = id => document.getElementById(id);
  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  const localDate = d => d.toLocaleDateString("en-CA");
  const now = new Date();
  const dayIdx = (now.getDay() + 6) % 7;
  const monday = new Date(now); monday.setDate(now.getDate() - dayIdx);
  const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6);
  const weekKey = localDate(monday);
  const fmt = d => d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
  const weekLabel = `${fmt(monday)} – ${fmt(sunday)}`;

  let data = store.get("moodGarden");
  if (!data || data.week !== weekKey) data = { week: weekKey, picks: Array(7).fill(null) };


  /* ---------- Soft hand-drawn flowers ---------- */
  function flowerSVG(m, cx, cy, r, cls = "") {
    const parts = [];
    for (let i = 0; i < m.petals; i++) {
      const a = (360 / m.petals) * i;
      if (m.shape === "long")
        parts.push(`<ellipse cx="${cx}" cy="${cy - r * .58}" rx="${r * .2}" ry="${r * .52}" transform="rotate(${a} ${cx} ${cy})"/>`);
      else if (m.shape === "heart")
        parts.push(`<path transform="rotate(${a} ${cx} ${cy})" d="M${cx} ${cy - r * .15} C ${cx - r * .75} ${cy - r * .55}, ${cx - r * .45} ${cy - r * 1.1}, ${cx} ${cy - r * .85} C ${cx + r * .45} ${cy - r * 1.1}, ${cx + r * .75} ${cy - r * .55}, ${cx} ${cy - r * .15} Z"/>`);
      else
        parts.push(`<circle cx="${cx}" cy="${cy - r * .55}" r="${r * .48}" transform="rotate(${a} ${cx} ${cy})"/>`);
    }
    return `<g class="${cls}">
      <g fill="${m.petal}" stroke="#042630" stroke-opacity=".7" stroke-width="1" stroke-linejoin="round">${parts.join("")}</g>
      <circle cx="${cx}" cy="${cy}" r="${r * .3}" fill="${m.center}" stroke="#042630" stroke-opacity=".7" stroke-width="1"/>
      <circle cx="${cx - r * .1}" cy="${cy - r * .1}" r="${r * .08}" fill="#d0d6d6" opacity=".85"/>
    </g>`;
  }
  const flowerIcon = (m, size) => `<svg viewBox="0 0 40 40" width="${size}" height="${size}" aria-hidden="true">${flowerSVG(m, 20, 20, 16)}</svg>`;

  /* ---------- The glass vase ---------- */
  const VASE = "M86 112 L86 126 C86 134 56 144 56 168 C56 186 74 194 100 194 C126 194 144 186 144 168 C144 144 114 134 114 126 L114 112 Z";
  function scene(justAdded = -1) {
    let stems = "", leaves = "", blooms = "";
    data.picks.forEach((id, i) => {
      if (!id) return;
      const m = MOODS.find(x => x.id === id), s = SPOTS[i], off = s.x - 100;
      const baseX = 100 + off * .28, neckX = 100 + off * .1;
      stems += `<path d="M${baseX} 186 C ${baseX} 160, ${neckX} 140, ${neckX} 118 S ${s.x - off * .1} ${s.y + 30}, ${s.x} ${s.y}"/>`;
      const lx = (neckX + s.x) / 2, ly = (118 + s.y) / 2 + 8, d = off < 0 ? -1 : 1;
      leaves += `<path d="M${lx} ${ly} q ${d * 12} -10 ${d * 20} -2 q ${d * -8} 10 ${d * -20} 2 z"/>`;
      blooms += flowerSVG(m, s.x, s.y, s.r, i === justAdded ? "pop" : "");
    });
    return `
      <defs>
        <linearGradient id="glass" x1="0" x2="1">
          <stop offset="0" stop-color="${C.slate}" stop-opacity=".35"/><stop offset=".3" stop-color="${C.mist}" stop-opacity=".15"/>
          <stop offset=".75" stop-color="${C.mist}" stop-opacity=".1"/><stop offset="1" stop-color="${C.slate}" stop-opacity=".3"/>
        </linearGradient>
        <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="${C.sea}" stop-opacity=".35"/><stop offset="1" stop-color="${C.sea}" stop-opacity=".6"/>
        </linearGradient>
        <clipPath id="inside"><path d="${VASE}"/></clipPath>
      </defs>
      <path d="M24 196 H176" stroke="${C.slate}" stroke-width="2" stroke-linecap="round"/>
      <g fill="none" stroke="${C.slate}" stroke-width="2.2" stroke-linecap="round" opacity=".85">${stems}</g>
      <g clip-path="url(#inside)">
        <rect x="40" y="148" width="120" height="60" fill="url(#water)"/>
        <path d="M50 148 Q100 152 150 148" fill="none" stroke="#d0d6d6" stroke-width="1.4" opacity=".9"/>
        <path d="${VASE}" fill="url(#glass)"/>
      </g>
      <path d="${VASE}" fill="none" stroke="${C.deep}" stroke-width="1.5" stroke-linejoin="round"/>
      <ellipse cx="100" cy="112" rx="14" ry="3" fill="#d0d6d6" fill-opacity=".7" stroke="${C.slate}" stroke-opacity=".6" stroke-width="1.2"/>
      <path d="M66 158 C64 170 68 180 76 186" fill="none" stroke="#d0d6d6" stroke-width="3.5" stroke-linecap="round" opacity=".95"/>
      <path d="M91 116 L91 127" stroke="#d0d6d6" stroke-width="2" stroke-linecap="round" opacity=".9"/>
      <g fill="#d0d6d6" opacity=".9"><circle cx="128" cy="162" r="1.6"/><circle cx="72" cy="150" r="1.4"/></g>
      <g fill="${C.sea}" stroke="${C.slate}" stroke-opacity=".5" stroke-width="1" stroke-linejoin="round">${leaves}</g>
      ${blooms}`;
  }

  function render(justAdded = -1) {
    $("jar").innerHTML = scene(justAdded);
    const any = data.picks.some(Boolean);
    $("hint").hidden = any;
    $("save").disabled = !any;
    $("sub").textContent = `Week of ${weekLabel}`;

    $("week").innerHTML = DAYS.map((d, i) => {
      const m = MOODS.find(x => x.id === data.picks[i]);
      return `<div class="day ${i === dayIdx ? "today" : ""}" title="${m ? d + ": " + m.label : d}">
        <div class="slot ${m ? "filled" : ""}">${m ? flowerIcon(m, 24) : ""}</div>${d}</div>`;
    }).join("");

    const picked = data.picks[dayIdx];
    $("ask").textContent = picked ? "Today's flower is in the vase ♡" : "How are you feeling today?";
    $("moods").innerHTML = MOODS.map(m => `
      <button class="px-btn mood" data-id="${m.id}" aria-pressed="${picked === m.id}">${flowerIcon(m, 30)}${m.label}</button>`).join("");
    $("moods").querySelectorAll(".mood").forEach(b => b.onclick = () => {
      data.picks[dayIdx] = data.picks[dayIdx] === b.dataset.id ? null : b.dataset.id;
      store.set("moodGarden", data);
      render(dayIdx);
    });
  }

  /* ---------- Download the week's bouquet as a PNG ---------- */
  const svgImage = svg => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej;
    i.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg); });
  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  async function download() {
    const W = 1080, H = 1350, c = document.createElement("canvas");
    c.width = W; c.height = H;
    const ctx = c.getContext("2d");
    try { await Promise.all([document.fonts.load('80px "Kiwi Maru"'), document.fonts.load('500 36px "Zen Maru Gothic"')]); } catch (e) {}

    ctx.fillStyle = C.deep; ctx.fillRect(0, 0, W, H);
    roundRect(ctx, 80, 80, 920, 1190, 70); ctx.fillStyle = C.mist; ctx.fill();
    ctx.lineWidth = 5; ctx.strokeStyle = C.slate; ctx.stroke();

    ctx.textAlign = "center";
    ctx.font = '500 84px "Kiwi Maru", serif'; ctx.fillStyle = C.night; ctx.fillText("Mood garden", W / 2, 240);
    ctx.font = '500 38px "Zen Maru Gothic", sans-serif'; ctx.fillStyle = C.slate;
    ctx.fillText(`My bouquet · ${weekLabel}`, W / 2, 305);

    const vase = await svgImage(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="680" height="680">${scene()}</svg>`);
    ctx.drawImage(vase, (W - 680) / 2, 330, 680, 680);

    const startX = W / 2 - 3 * 110;
    for (let i = 0; i < 7; i++) {
      const x = startX + i * 110, y = 1090, m = MOODS.find(k => k.id === data.picks[i]);
      ctx.beginPath(); ctx.arc(x, y, 40, 0, Math.PI * 2);
      ctx.fillStyle = C.mist; ctx.fill();
      ctx.lineWidth = 2.5; ctx.setLineDash(m ? [] : [7, 7]); ctx.strokeStyle = C.slate; ctx.stroke(); ctx.setLineDash([]);
      if (m) ctx.drawImage(await svgImage(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="64" height="64">${flowerSVG(m, 20, 20, 16)}</svg>`), x - 32, y - 32, 64, 64);
      ctx.font = '500 28px "Zen Maru Gothic", sans-serif'; ctx.fillStyle = C.slate;
      ctx.fillText(DAYS[i], x, y + 80);
    }
    const a = document.createElement("a");
    a.download = `mood-bouquet-${weekKey}.png`; a.href = c.toDataURL("image/png");
    document.body.appendChild(a); a.click(); a.remove();
  }

  $("save").onclick = () => download().catch(() => alert("The bouquet couldn't be saved. Try opening the widget in its own tab."));

  setInterval(() => { if (localDate(new Date()) !== localDate(now)) location.reload(); }, 60000);
  render();
</script>
<script>
  /* Shrinks the widget to fit the Notion embed, whatever size the embed is */
  (function () {
    const fit = () => {
      const card = document.querySelector(".px-card");
      if (!card) return;
      card.style.zoom = 1;
      const pad = 16, w = card.offsetWidth + pad, h = card.offsetHeight + pad;
      const s = Math.min(1, innerWidth / w, innerHeight / h);
      card.style.zoom = Math.max(.4, Math.floor(s * 50) / 50);
    };
    addEventListener("resize", fit);
    new ResizeObserver(fit).observe(document.body);
    if (document.fonts) document.fonts.ready.then(fit);
    addEventListener("load", fit);
    fit();
  })();
</script>
</body>
</html>
